<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Razorpay Payment</title>
</head>

<body>
    <h1>Razorpay Payment Gateway Integration</h1>
    <div class="payment-form" style="display: flex;">
        <div style="padding: 0 5px;" class="payment-button">
            <form>
                <label for="amount">Amount:</label>
                <input type="number" id="amount" name="amount" required>
                <button type="button" onclick="payNow()">Pay Now</button>
            </form>
        </div>
        <div style="padding: 0 5px;" id="Generate-excel-report-button">
            <button type="button" onclick="generateExcel()">Generate Last Payments Excel Report</button>
        </div>
    </div>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script>
        async function payNow() {
            const amount = document.getElementById('amount').value;

            // Create order by calling the server endpoint
            const response = await fetch('http://localhost:3000/api/payment/order/create', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    amount,
                    currency: 'INR'
                })
            });

            const order = await response.json();

            // Open Razorpay Checkout
            const options = {
                key: 'rzp_test_9b7dgczCYLxepF', // Replace with your Razorpay key_id
                amount: '50000', // Amount is in currency subunits. Default currency is INR. Hence, 50000 refers to 50000 paise
                currency: 'INR',
                name: 'Test Payment',
                description: 'Test Transaction',
                order_id: order.id, // This is the order_id created in the backend
                callback_url: 'http://localhost:3000/api/payment/verify/transaction', // Your success URL
                // prefill: {
                //     name: 'Gaurav Kumar',
                //     email: 'gaurav.kumar@example.com',
                //     contact: '9999999999'
                // },
                theme: {
                    color: '#F37254'
                },
            };

            const rzp = new Razorpay(options);
            rzp.open();
        }

        async function generateExcel() {
            const response = await fetch('http://localhost:3000/api/payment/generate/excel', {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json'
                }
            });

            const result = await response.json();
            if (result.success) {
                alert('Excel file generated successfully!');
            } else {
                alert('Failed to generate Excel file!');
            }
        }
    </script>
</body>

</html>
